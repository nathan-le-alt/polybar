[colors]
background = #BF000000
foreground = #cccccc
active = #ffffff
inactive = #666666

[bar/main]
width = 100%
height = 18pt
offset-x = 0
offset-y = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0pt
border-size = 0pt

padding-left = 1
padding-right = 2

module-margin = 1

font-0 = SF Mono:style=Bold:size=10;2

modules-left = i3
modules-right = cpu memory filesystem vpn date

# Polybar v3.7+ Tray configuration (replaces deprecated tray-position/padding)
tray-position = right
tray-padding = 2

cursor-click = pointer

[module/i3]
type = internal/i3

enable-click = true
enable-scroll = false

label-focused = %index%
label-focused-background = #111111
label-focused-foreground = ${colors.active}
label-focused-padding = 1

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.inactive}
label-unfocused-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format = CPU <label>
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format = RAM <label>
label = %gb_used%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 10

# Fixed missing mount labels
label-mounted = DISK %free%
format-mounted = <label-mounted>

[module/date]
type = internal/date
interval = 1

date = %A, %d %B %Y
time = %H:%M:%S

label = %date% %time%

[module/vpn]
type = custom/script
interval = 5

exec = hostname -I | awk '{print $1}'
format = VPN <label>
label = %output%
